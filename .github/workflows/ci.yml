name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # The end-to-end bridge tests run against the real hermes-bridge package.
      - uses: actions/checkout@v4
        with:
          repository: suryavamsi6/hermes-bridge
          path: .hermes-bridge
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npx tsc --noEmit
      - run: npm test
        env:
          HERMES_BRIDGE_SRC: ${{ github.workspace }}/.hermes-bridge
