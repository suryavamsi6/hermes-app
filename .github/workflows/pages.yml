# Publishes site/ to GitHub Pages (Settings -> Pages -> Source: GitHub Actions).
name: Pages

on:
  push:
    branches: [main]
    paths: ["site/**", "scripts/build-site.py", "scripts/site-face-paths.json", "docs/screenshots/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Build the site (bot-face SVGs, screenshots, subset fonts)
        run: |
          pip install fonttools brotli
          python scripts/build-site.py
      - name: Drop build-only files
        run: rm -f site/index.template.html site/.gitignore
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b  # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4
