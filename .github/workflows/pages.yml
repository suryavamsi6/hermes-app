# Publishes site/ to GitHub Pages (Settings -> Pages -> Source: GitHub Actions).
name: Pages

on:
  push:
    branches: [main]
    paths: ["site/**", "scripts/build-site.py", "scripts/site-face-paths.json", "docs/screenshots/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the site (bot-face SVGs, screenshots, subset fonts)
        run: |
          pip install fonttools brotli
          python scripts/build-site.py
      - name: Drop build-only files
        run: rm -f site/index.template.html site/.gitignore
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
