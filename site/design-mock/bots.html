<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Hermes · Bot studies</title>
<style>
:root{color-scheme:dark;font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#09090b;color:#f5f5f6}*{box-sizing:border-box}body{margin:0}main{max-width:1040px;margin:auto;padding:40px 24px 64px}header{display:flex;justify-content:space-between;align-items:end;gap:20px;border-bottom:1px solid #29292e;padding-bottom:24px}.eyebrow{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:#9c9ca6;font-weight:700}h1{font-size:clamp(28px,5vw,42px);letter-spacing:-.045em;margin:8px 0 0;font-weight:650}.hint{color:#a5a5ad;font-size:13px;margin:0}.grid{display:grid;grid-template-columns:1.35fr 1fr 1fr;gap:16px;margin-top:24px}.card{background:#151518;border:1px solid #29292e;border-radius:24px;min-width:0;overflow:hidden}.stage{height:238px;display:grid;place-items:center;overflow:hidden}.hero .stage{height:300px}.meta{padding:0 20px 18px}.name{font-size:19px;font-weight:650;letter-spacing:-.02em}.sub{font-size:12px;color:#a5a5ad;margin-top:4px}.chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 20px 20px}.chips button{appearance:none;border:1px solid #3a3a40;border-radius:99px;background:#202024;color:#c3c3ca;min-height:36px;padding:0 11px;font:600 12px inherit;font-family:inherit;cursor:pointer}.chips button[aria-pressed=true]{background:#f0f0f2;color:#17171a;border-color:#f0f0f2}.chips button:focus-visible,.bot:focus-visible{outline:2px solid white;outline-offset:4px}.context{margin-top:32px}.section-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}.section-head h2{font-size:15px;margin:0;font-weight:650}.section-head span{font-size:12px;color:#92929b}.chat{background:#151518;border:1px solid #29292e;border-radius:20px;padding:20px;display:flex;gap:14px;align-items:flex-start}.message{font-size:15px;line-height:1.5;color:#dedee2}.message strong{display:block;color:#fafafa;font-size:13px;margin-bottom:4px}.message p{margin:0}.bot{--size:164px;width:var(--size);height:var(--size);position:relative;perspective:calc(var(--size) * 4);touch-action:none;cursor:grab;user-select:none;flex:none}.bot:active{cursor:grabbing}.hero .bot{--size:212px}.chat .bot{--size:44px}.rig,.layer,.eyes{position:absolute;inset:0;transform-style:preserve-3d}.rig{will-change:transform}.layer{background:linear-gradient(145deg,var(--a),var(--b));clip-path:var(--shape);will-change:transform}.back{filter:brightness(.56)}.face{box-shadow:inset 0 0 0 2px #ffffff38}.shadow{position:absolute;left:12%;right:12%;bottom:-5%;height:18%;border-radius:50%;background:#000;opacity:.35;filter:blur(8px);will-change:transform}.eyes{will-change:transform;pointer-events:none}.eye{position:absolute;top:37%;width:12%;height:20%;border-radius:50%;background:var(--ink);will-change:transform;transform-origin:center}.eye.left{left:29%}.eye.right{right:29%}.bot[data-shape=hex] .eye{width:15%;height:15%;top:39%}.bot[data-mood=happy] .eye{background:transparent;border:solid var(--ink);border-width:clamp(2px, .025 * var(--size), 5px) 0 0;border-radius:50% 50% 0 0;height:13%;top:40%}.bot[data-mood=error] .eye.left{rotate:-12deg}.bot[data-mood=error] .eye.right{rotate:12deg}@media(max-width:720px){main{padding:28px 16px 48px}header{align-items:start;flex-direction:column;gap:10px}.grid{grid-template-columns:1fr 1fr}.hero{grid-column:1/-1}.stage{height:190px}.hero .stage{height:260px}.bot{--size:140px}.hero .bot{--size:190px}.chat .bot{--size:44px}.meta,.chips{padding-left:16px;padding-right:16px}}@media(max-width:390px){.grid{grid-template-columns:1fr}.hero{grid-column:auto}.stage{height:200px}}
</style></head><body><main><header><div><div class="eyebrow">Hermes / character study</div><h1>A little more alive.</h1></div><p class="hint">Drag a bot to feel its depth.</p></header><div class="grid" id="gallery"></div><section class="context"><div class="section-head"><h2>In conversation</h2><span>44 px</span></div><div class="chat"><div id="inline"></div><div class="message"><strong>Atlas</strong><p>Morning. I’ve put your priorities together for today.</p></div></div></section></main>
<script>
const shapes={squircle:'inset(3% round 30%)',hex:'polygon(25% 5%,75% 5%,96% 50%,75% 95%,25% 95%,4% 50%)',flower:'polygon(50% 2%,61% 6%,71% 3%,79% 12%,89% 15%,92% 26%,98% 35%,94% 46%,98% 56%,92% 66%,89% 77%,79% 81%,72% 92%,61% 90%,50% 98%,39% 90%,28% 92%,21% 81%,11% 77%,8% 66%,2% 56%,6% 46%,2% 35%,8% 26%,11% 15%,21% 12%,29% 3%,39% 6%)'};
const bots=[{name:'Atlas',shape:'squircle',a:'#8c7bff',b:'#1d2b4f',ink:'#f7f7f7',sub:'Squircle · Dusk',hero:true},{name:'Nova',shape:'flower',a:'#ffd66b',b:'#9a3b2e',ink:'#121214',sub:'Flower · Honey variant'},{name:'Forge',shape:'hex',a:'#8cc8ff',b:'#1d6670',ink:'#121214',sub:'Hexagon · Lagoon variant'}];
const moods=['idle','working','thinking','happy','listening','error'];const reduce=matchMedia('(prefers-reduced-motion: reduce)');const instances=[];
function createBot(data,small=false){const el=document.createElement('div');el.className='bot';el.dataset.shape=data.shape;el.dataset.mood='idle';el.setAttribute('role','img');el.setAttribute('aria-label',data.name+' bot, idle');el.style.cssText=`--a:${data.a};--b:${data.b};--ink:${data.ink};--shape:${shapes[data.shape]}`;el.innerHTML='<div class="shadow"></div><div class="rig"><div class="layer back"></div><div class="layer face"></div><div class="eyes"><div class="eye left"></div><div class="eye right"></div></div></div>';const b={el,rig:el.querySelector('.rig'),back:el.querySelector('.back'),face:el.querySelector('.face'),eyes:el.querySelector('.eyes'),eye:[...el.querySelectorAll('.eye')],shadow:el.querySelector('.shadow'),mood:'idle',x:0,y:0,vx:0,vy:0,tx:0,ty:0,drag:false,phase:Math.random()*10,nextBlink:performance.now()+2000+Math.random()*3000,blinkAt:0,small};instances.push(b);el.addEventListener('pointerdown',e=>{if(reduce.matches)return;b.drag=true;b.startX=e.clientX;b.startY=e.clientY;b.originX=b.x;b.originY=b.y;b.lastX=e.clientX;b.lastY=e.clientY;b.lastTime=performance.now();b.vx=b.vy=0;el.setPointerCapture(e.pointerId)});el.addEventListener('pointermove',e=>{if(!b.drag)return;const size=el.clientWidth,now=performance.now(),dt=Math.max(8,now-b.lastTime)/1000;b.tx=Math.max(-14,Math.min(14,b.originX+(e.clientX-b.startX)/size*28));b.ty=Math.max(-12,Math.min(12,b.originY-(e.clientY-b.startY)/size*24));b.vx=Math.max(-100,Math.min(100,(e.clientX-b.lastX)/size*28/dt));b.vy=Math.max(-100,Math.min(100,-(e.clientY-b.lastY)/size*24/dt));b.lastX=e.clientX;b.lastY=e.clientY;b.lastTime=now});function release(){if(!b.drag)return;b.drag=false;b.tx=b.ty=0;if(performance.now()-b.lastTime>100)b.vx=b.vy=0}el.addEventListener('pointerup',release);el.addEventListener('pointercancel',release);el.addEventListener('lostpointercapture',release);return b}
for(const data of bots){const card=document.createElement('article');card.className='card'+(data.hero?' hero':'');card.innerHTML=`<div class="stage"></div><div class="meta"><div class="name">${data.name}</div><div class="sub">${data.sub}</div></div><div class="chips" role="group" aria-label="${data.name} mood"></div>`;const b=createBot(data);card.querySelector('.stage').append(b.el);for(const mood of moods){const button=document.createElement('button');button.textContent=mood[0].toUpperCase()+mood.slice(1);button.setAttribute('aria-pressed',String(mood==='idle'));button.onclick=()=>{b.mood=mood;b.el.dataset.mood=mood;b.el.setAttribute('aria-label',data.name+' bot, '+mood);b.moodAt=performance.now();card.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===button)))};card.querySelector('.chips').append(button)}document.querySelector('#gallery').append(card)}document.querySelector('#inline').append(createBot(bots[0],true).el);
let last=performance.now(),frame=0;function tick(now){const dt=Math.min(.032,(now-last)/1000);last=now;for(const b of instances){const calm=reduce.matches;if(calm){b.x=b.y=b.vx=b.vy=b.tx=b.ty=0;b.drag=false}else if(b.drag){b.x=b.tx;b.y=b.ty}else{b.vx+=(-190*b.x-22*b.vx)/.8*dt;b.vy+=(-190*b.y-22*b.vy)/.8*dt;b.x+=b.vx*dt;b.y+=b.vy*dt}const t=now/1000+b.phase,m=b.mood;let rx=0,ry=0,rz=0,ex=0,ey=0,sx=1,sy=1,blink=1,lift=0;if(m==='working'){sy=.72;ey=3;rx=calm?0:Math.sin(t*3)*2.4}else if(m==='thinking'){ex=5;ey=-5;rz=calm?0:Math.sin(t*1.2)*3;ry=calm?0:Math.sin(t*.8)*3}else if(m==='listening'){sy=1.13;ey=-3;rx=calm?0:-3+Math.sin(t*1.1)}else if(m==='error'){sy=.7;ey=4;rz=-3}else if(m==='happy'){lift=calm?0:-Math.max(0,1-(now-(b.moodAt||0))/600)*8}if(!calm&&m!=='happy'){if(now>b.nextBlink){b.blinkAt=now;b.nextBlink=now+2400+Math.random()*3600}const d=now-b.blinkAt;if(d>=0&&d<200)blink=d<70?1-.92*d/70:.08+.92*(d-70)/130;if(m==='idle'){ex+=Math.sin(t*.55)*1.3;ry+=Math.sin(t*.7)*1.2}}const breath=calm?1:1+Math.sin(t*1.5)*.008;const x=b.x+ry,y=b.y+rx; b.rig.style.transform=`translateY(${lift}%) rotateX(${y}deg) rotateY(${x}deg) rotateZ(${rz}deg) scale(${breath})`;b.back.style.transform=`translate3d(${-x*.16}%,${3-y*.12}%,${b.small?'-2px':'-9px'})`;b.face.style.transform='translateZ(0px)';b.eyes.style.transform=`translate3d(${ex+x*.24}%,${ey-y*.24}%,${b.small?'3px':'16px'})`;for(const eye of b.eye)eye.style.transform=`scale(${sx},${sy*blink})`;b.shadow.style.transform=`translate(${x*-.25}%,${Math.abs(y)*.1}%) scale(${1-Math.min(.1,Math.abs(x)*.004)})`}frame=requestAnimationFrame(tick)}frame=requestAnimationFrame(tick);document.addEventListener('visibilitychange',()=>{if(document.hidden){cancelAnimationFrame(frame)}else{last=performance.now();frame=requestAnimationFrame(tick)}});
</script></body></html>
